name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:

  notes:
    # The release body is the changelog section for the tag. GitHub's own
    # generated notes are a bare "Full Changelog" link on a repo without pull
    # requests — which is all the v0.1.0–v0.1.5 pages ever carried — so the
    # section is extracted here and published through body_path below. Every
    # build job needs this one, so a tag without its entry fails in seconds
    # instead of after the whole matrix; a test of the same name in
    # crates/adapters/all/src/lib.rs catches it before the tag is cut at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the section and the commits link
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            python3 scripts/changelog-section.py "$V"
            printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
          } > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  macos:
    needs: [notes, cli-linux]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-linux-*
          path: collector
          merge-multiple: true
      - name: Stage collectors
        shell: bash
        run: |
          # tauri bundle resources (untracked build inputs — see tauri.conf.json);
          # built by the cli-linux job, consumed here so a mirrored checkout builds
          mkdir -p apps/kimo-token-bar/src-tauri/resources/collector
          for a in x86_64 aarch64; do
            cp "collector/kimo-token-$a" "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
            chmod +x "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/kimo-token-bar/pnpm-lock.yaml
      - name: Build
        id: build
        # pipefail or the tee swallows the script's exit code: a mid-build
        # failure would march on to Stage artifacts and die there, miles from
        # the actual error.
        run: set -o pipefail; ./scripts/build-macos.sh 2>&1 | tee build.log
      - name: Surface build failure
        if: failure()
        run: |
          grep -nE 'error(\[[0-9]*\])?:|FAILED|failures:|panicked at|warning: build failed|ELIFECYCLE|Command failed' build.log | tail -50 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
      - name: Stage artifacts
        run: |
          B=apps/kimo-token-bar/src-tauri/target/release/bundle
          mkdir -p dist
          ditto -c -k --keepParent "$B/macos/kimo-token.app" dist/kimo-token-macos-arm64.app.zip
          cp "$B"/dmg/kimo-token_*.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: dist/*

  macos-universal:
    needs: [notes, cli-linux]
    # The Intel+Apple Silicon joint bundle: one DMG runs on every Mac. The
    # arm64 build above stays the smaller download for the common case.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-linux-*
          path: collector
          merge-multiple: true
      - name: Stage collectors
        shell: bash
        run: |
          # tauri bundle resources (untracked build inputs — see tauri.conf.json)
          mkdir -p apps/kimo-token-bar/src-tauri/resources/collector
          for a in x86_64 aarch64; do
            cp "collector/kimo-token-$a" "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
            chmod +x "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
          done
      # universal-apple-darwin is not a rust target: cargo compiles BOTH sides
      # and tauri lipos them, so both toolchains must be installed up front —
      # the host-only default dies the moment x86_64 is requested.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/kimo-token-bar/pnpm-lock.yaml
      - name: Install frontend deps
        # The frontend lives in apps/kimo-token-bar; from the repo root pnpm
        # finds no package.json and dies before the build even starts.
        run: pnpm --dir apps/kimo-token-bar install --frozen-lockfile --prefer-offline
      - name: Build
        id: build
        run: set -o pipefail; pnpm --dir apps/kimo-token-bar tauri build --target universal-apple-darwin 2>&1 | tee build-universal.log
      - name: Surface build failure
        if: failure()
        # The check annotations are the only anonymous window into a failed
        # run (logs and artifacts need auth), so the log's tail rides them —
        # the pattern grep first, then the raw last lines, whatever they are.
        run: |
          grep -nE 'error(\[[0-9]*\])?:|FAILED|failures:|panicked at|warning: build failed|ELIFECYCLE|Command failed' build-universal.log | tail -50 | while IFS= read -r line; do echo "::error::$line"; done || true
          tail -40 build-universal.log | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-universal
          path: build-universal.log
          retention-days: 7
      - name: Sign and stage
        run: |
          APP=apps/kimo-token-bar/src-tauri/target/universal-apple-darwin/release/bundle/macos/kimo-token.app
          codesign --force --sign - "$APP"
          codesign -v "$APP"
          mkdir -p dist
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          D=apps/kimo-token-bar/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          mkdir -p "$D"
          hdiutil create -quiet -volname kimo-token -srcfolder "$STAGE" -ov -format UDZO "$D/kimo-token_universal.dmg"
          rm -rf "$STAGE"
          cp "$D"/kimo-token_universal.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: panel-universal
          path: dist/*

  cli:
    needs: [notes]
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: set -o pipefail; cargo build --locked --release -p usage-cli --target ${{ matrix.target }} 2>&1 | tee build-cli.log
      - name: Surface build failure
        if: failure()
        shell: bash
        run: |
          grep -nE 'error(\[[0-9]*\])?:|error:|warning: build failed|linking with' build-cli.log | tail -50 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          tar -czf "dist/kimo-token-cli-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" kimo-token
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/kimo-token.exe" -DestinationPath "dist/kimo-token-cli-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  cli-linux:
    needs: [notes]
    # Fully static musl builds for Linux collectors, cross-compiled with zig so
    # no distro toolchain enters the picture. Same recipe as
    # scripts/build-linux.sh; the tarball carries install-linux.sh next to the
    # binary for the headless collector install.
    strategy:
      matrix:
        include:
          - { arch: x86_64 }
          - { arch: aarch64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: set -o pipefail; cargo zigbuild --release -p usage-cli --target ${{ matrix.arch }}-unknown-linux-musl 2>&1 | tee build-cli-linux.log
      - name: Surface build failure
        if: failure()
        shell: bash
        run: |
          grep -nE 'error(\[[0-9]*\])?:|error:|warning: build failed|linking with' build-cli-linux.log | tail -50 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Package
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PKG=kimo-token-cli-$V-${{ matrix.arch }}-linux-musl
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.arch }}-unknown-linux-musl/release/kimo-token" "dist/$PKG/kimo-token"
          cp scripts/install-linux.sh "dist/$PKG/install-linux.sh"
          chmod +x "dist/$PKG/kimo-token" "dist/$PKG/install-linux.sh"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          rm -rf "dist/$PKG"
          # raw binary rides the artifact too: the panel packaging jobs stage
          # it as tauri bundle resources (a mirrored checkout has none)
          cp "target/${{ matrix.arch }}-unknown-linux-musl/release/kimo-token" "dist/kimo-token-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: dist/*

  linux-panel:
    needs: [notes, cli-linux]
    # Native builds on the oldest supported Ubuntu baseline keep glibc
    # requirements below those of newer desktop releases.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: amd64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-linux-*
          path: collector
          merge-multiple: true
      - name: Stage collectors
        shell: bash
        run: |
          mkdir -p apps/kimo-token-bar/src-tauri/resources/collector
          for a in x86_64 aarch64; do
            install -m 0755 "collector/kimo-token-$a" "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
          done
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/kimo-token-bar/pnpm-lock.yaml
      - name: Build and test Linux desktop
        run: |
          set -o pipefail
          bash scripts/build-linux-desktop.sh 2>&1 | tee "build-linux-panel-${{ matrix.arch }}.log"
      - name: Surface build failure
        if: failure()
        run: |
          LOG="build-linux-panel-${{ matrix.arch }}.log"
          if [ -f "$LOG" ]; then
            grep -nE 'error(\[[0-9]*\])?:|FAILED|failures:|panicked at|warning: build failed|ELIFECYCLE' "$LOG" | tail -50 | while IFS= read -r line; do echo "::error::$line"; done || true
            tail -40 "$LOG" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-${{ matrix.arch }}
          path: build-linux-panel-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage Debian package
        run: |
          packages=(apps/kimo-token-bar/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#packages[@]}" -ne 1 ] || [ ! -f "${packages[0]}" ]; then
            echo "::error::Expected exactly one Debian package"
            exit 1
          fi
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = "${{ matrix.arch }}"
          dpkg-deb --info "${packages[0]}"
          mkdir -p dist
          cp "${packages[0]}" "dist/kimo-token-linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: panel-linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  windows-panel:
    needs: [notes, cli-linux]
    # The NSIS setup exe for the Windows menu-bar panel. No cross-compile:
    # the runner IS the platform, Tauri's Windows bundling needs WebView2
    # tooling that only exists there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-linux-*
          path: collector
          merge-multiple: true
      - name: Stage collectors
        shell: bash
        run: |
          # tauri bundle resources (untracked build inputs — see tauri.conf.json)
          mkdir -p apps/kimo-token-bar/src-tauri/resources/collector
          for a in x86_64 aarch64; do
            cp "collector/kimo-token-$a" "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
            chmod +x "apps/kimo-token-bar/src-tauri/resources/collector/kimo-token-$a"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/kimo-token-bar/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm --dir apps/kimo-token-bar install --frozen-lockfile
      - name: Build
        id: build
        shell: pwsh
        run: |
          cd apps/kimo-token-bar
          pnpm tauri build --bundles nsis 2>&1 | Tee-Object -FilePath ..\..\build-win-panel.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "apps/kimo-token-bar/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "dist/kimo-token-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: panel-windows
          path: dist/*

  release:
    needs: [notes, macos, macos-universal, windows-panel, linux-panel, cli, cli-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Hash
        run: |
          cd dist
          sha256sum kimo-token_*.dmg kimo-token-macos-*.app.zip kimo-token-windows-*.exe kimo-token-linux-*.deb kimo-token-cli-* > ../sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          # The body is the notes job's artifact, merged into dist/ by
          # download-artifact — and never generate_release_notes again: on a
          # repo without pull requests the generator produces exactly the bare
          # "Full Changelog" line every earlier page shipped.
          body_path: dist/notes.md
          files: |
            dist/kimo-token_*.dmg
            dist/kimo-token-macos-*.app.zip
            dist/kimo-token-windows-*.exe
            dist/kimo-token-linux-*.deb
            dist/kimo-token-cli-*
            sha256.txt
            latest.json

  homebrew:
    # 可选：为 HOMEBREW_TAP_REPOSITORY 指定的 tap 更新配方和发布校验值。
    # 同时配置该仓库的 TAP_DEPLOY_KEY 后才启用；新仓库默认跳过。
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard
        id: guard
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ] || [ -z "$TAP_REPOSITORY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump the tap
        if: steps.guard.outputs.skip == 'false'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "${TAP_DEPLOY_KEY}" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${TAP_REPOSITORY}.git" tap
          curl --fail --silent --show-error --location "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sha256.txt" -o sha256.txt
          install -D packaging/homebrew/Casks/kimo-token.rb tap/Casks/kimo-token.rb
          install -D packaging/homebrew/Formula/kimo-token-cli.rb tap/Formula/kimo-token-cli.rb
          python3 packaging/homebrew/bump.py "${TAG#v}" sha256.txt tap
          cd tap
          git config user.email "agent@users.noreply.github.com"
          git config user.name "kimo-token-release-bot"
          git add -A
          git commit -m "kimo-token ${GITHUB_REF_NAME}"
          git push
